name: Watches

on:
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * 5"

permissions:
  contents: read

jobs:
  doc-watch:
    name: Cloudflare docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Include cold-cache Go downloads and telemetry.
          allowed-endpoints: >-
            api.github.com:443
            developers.cloudflare.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            telemetry.go.dev:443
            www.cloudflare.com:443

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: 🔎 Check the built-in Cloudflare drift watches
        working-directory: scripts/github-actions/cloudflare-doc-watch
        run: go run .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auth-error-watch:
    name: Cloudflare auth-error behavior
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Include cold-cache Go downloads and telemetry.
          allowed-endpoints: >-
            api.cloudflare.com:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            telemetry.go.dev:443

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: scripts/github-actions/cloudflare-auth-error-watch/go.sum

      - name: 🧪 Run auth-error behavior watch
        working-directory: scripts/github-actions/cloudflare-auth-error-watch
        run: go run .

  external-links:
    name: External URLs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Probe evolving documentation URLs and their redirects without a fixed allowlist.
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: scripts/github-actions/link-check/go.mod
      - name: 🌐 Probe external links
        working-directory: scripts/github-actions/link-check
        run: go run . external
