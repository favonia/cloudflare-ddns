name: Lean Verify

on:
  push:
    branches: ["main"]
    paths:
      - "proofs/**"
      - "internal/hostid6/**"
      - ".github/workflows/lean-verify.yaml"
  pull_request:
    paths:
      - "proofs/**"
      - "internal/hostid6/**"
      - ".github/workflows/lean-verify.yaml"

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=leanprover/elan
  ELAN_VERSION: "v4.2.4"

jobs:
  lean-verify:
    name: Lean Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          # Include Lean releases, cold-cache Go downloads, and Go telemetry.
          allowed-endpoints: >-
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            release.lean-lang.org:443
            releases.lean-lang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            telemetry.go.dev:443

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦦 Install Lean
        run: |
          curl --fail --location --show-error --silent \
            --output "$RUNNER_TEMP/elan-init.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          tar --extract --gzip \
            --file "$RUNNER_TEMP/elan-init.tar.gz" \
            --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" \
            -y \
            --default-toolchain none \
            --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 🦦 Build proofs and oracle, and reject any sorry
        working-directory: proofs
        run: |
          lake build --wfail --iofail

      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: 📡 Run `go telemetry on`
        run: |
          go telemetry on

      - name: 🧪 Run differential test with Lean oracle
        run: |
          HOSTID6_LEAN_ORACLE="$PWD/proofs/.lake/build/bin/oracle" go test -tags lean_oracle ./internal/hostid6/...
