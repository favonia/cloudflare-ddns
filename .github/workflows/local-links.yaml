name: Links

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  local-links:
    name: In-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true
          policy: go-tooling

      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: scripts/github-actions/link-check/go.mod
      - name: 📡 Run `go telemetry on`
        run: |
          go telemetry on
      - name: 🔎 Check repository-local links
        working-directory: scripts/github-actions/link-check
        run: go run . local
